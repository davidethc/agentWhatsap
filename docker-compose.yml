# n8n en queue mode: main + worker + runners externos, PostgreSQL y Redis.
# Postgres y Redis solo son accesibles dentro de la red Docker del proyecto.
# n8n se publica únicamente en 127.0.0.1:5678 (ngrok apunta ahí).
name: agentwhatsap

x-n8n-env: &n8n-env
  N8N_HOST: ${N8N_HOST}
  N8N_PORT: 5678
  N8N_PROTOCOL: ${N8N_PROTOCOL}
  WEBHOOK_URL: ${WEBHOOK_URL}
  N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
  N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"

  DB_TYPE: postgresdb
  DB_POSTGRESDB_HOST: postgres
  DB_POSTGRESDB_PORT: 5432
  DB_POSTGRESDB_DATABASE: ${POSTGRES_DB}
  DB_POSTGRESDB_USER: ${POSTGRES_USER}
  DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}

  EXECUTIONS_MODE: queue
  QUEUE_BULL_REDIS_HOST: redis
  QUEUE_BULL_REDIS_PORT: 6379
  QUEUE_BULL_REDIS_PASSWORD: ${REDIS_PASSWORD}
  QUEUE_HEALTH_CHECK_ACTIVE: "true"

  N8N_RUNNERS_MODE: external
  N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
  N8N_RUNNERS_BROKER_LISTEN_ADDRESS: 0.0.0.0

  GENERIC_TIMEZONE: ${GENERIC_TIMEZONE:-America/Guayaquil}
  TZ: ${GENERIC_TIMEZONE:-America/Guayaquil}

  # Integración Kapso: se instala desde el entorno en main y en worker.
  N8N_COMMUNITY_PACKAGES_ENABLED: "true"
  N8N_COMMUNITY_PACKAGES_MANAGED_BY_ENV: "true"
  N8N_COMMUNITY_PACKAGES: '[{"name":"@kapso/n8n-nodes-kapso","version":"0.2.0"}]'

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      <<: *n8n-env
      N8N_PROXY_HOPS: 1
    volumes:
      # Volumen original: conserva también la SQLite antigua (no se usa ni se borra).
      - n8n_data:/home/node/.n8n
      - ./local-files:/files
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION}
    restart: unless-stopped
    command: worker
    environment:
      <<: *n8n-env
      # El worker no instala desde N8N_COMMUNITY_PACKAGES: reinstala Kapso
      # desde la lista de paquetes registrada en PostgreSQL.
      N8N_REINSTALL_MISSING_PACKAGES: "true"
    volumes:
      - n8n_worker_data:/home/node/.n8n
      - ./local-files:/files
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:5678/healthz | grep -q ok"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      n8n:
        condition: service_healthy

  n8n-runner:
    image: n8nio/runners:${N8N_VERSION}
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
    depends_on:
      n8n:
        condition: service_healthy

  n8n-worker-runner:
    image: n8nio/runners:${N8N_VERSION}
    restart: unless-stopped
    environment:
      N8N_RUNNERS_TASK_BROKER_URI: http://n8n-worker:5679
      N8N_RUNNERS_AUTH_TOKEN: ${N8N_RUNNERS_AUTH_TOKEN}
    depends_on:
      n8n-worker:
        condition: service_healthy

volumes:
  n8n_data:
  n8n_worker_data:
  postgres_data:
  redis_data:
